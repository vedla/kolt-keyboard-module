image: node:22

stages:
  - build
  - publish
  - release

variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn-cache'

cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .yarn-cache/

build:
  stage: build
  script:
    - corepack enable
    - yarn install --frozen-lockfile
    - yarn build
    - yarn pack --filename "kolt-keyboard-${CI_COMMIT_SHA}.tgz"
  artifacts:
    paths:
      - build/
      - kolt-keyboard-*.tgz
    expire_in: 1 week

publish:
  stage: publish
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - corepack enable
    - yarn --version
    - printf "//%s/api/v4/projects/%s/packages/npm/:_authToken=%s\n" "$CI_SERVER_HOST" "$CI_PROJECT_ID" "$CI_JOB_TOKEN" > .npmrc
    - printf "registry \"https://%s/api/v4/projects/%s/packages/npm/\"\n" "$CI_SERVER_HOST" "$CI_PROJECT_ID" > .yarnrc
    - yarn publish --non-interactive

release:
  stage: release
  needs:
    - job: build
      artifacts: true
    - job: publish
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - kolt-keyboard-*.tgz
    expire_in: never
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: 'Published kolt-keyboard package.'
    assets:
      links:
        - name: 'kolt-keyboard package'
          url: '$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/kolt-keyboard-$CI_COMMIT_SHA.tgz'
          link_type: 'package'
