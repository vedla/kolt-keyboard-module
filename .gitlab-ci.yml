image: node:24

stages:
  - tag
  - build
  - publish
  - release

variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn-cache'

cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .yarn-cache/

auto_tag:
  image: node:24
  stage: tag
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl
  script:
    - test -n "$RELEASE_TOKEN" || (echo "RELEASE_TOKEN is not available. Add a masked project access token with api scope to CI/CD variables." && exit 1)
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - VERSION_TAG="v${PACKAGE_VERSION}"
    - TAG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/${VERSION_TAG}"
    - |
      TAG_STATUS=$(curl --silent --show-error --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" --write-out '%{http_code}' --output /dev/null "$TAG_URL")
      if [[ "$TAG_STATUS" == "200" ]]; then
        echo "${VERSION_TAG} already exists; nothing to do."
      elif [[ "$TAG_STATUS" == "404" ]]; then
        curl --fail-with-body --request POST --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" \
          --form "tag_name=${VERSION_TAG}" \
          --form "ref=${CI_COMMIT_SHA}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags"

      else
        echo "Unable to check ${VERSION_TAG}; GitLab returned HTTP ${TAG_STATUS}. Ensure RELEASE_TOKEN is a project access token with api scope and tag-create permission."
        exit 1
      fi

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn pack --filename "kolt-keyboard-${CI_COMMIT_SHA}.tgz"
  artifacts:
    paths:
      - build/
      - kolt-keyboard-*.tgz
    expire_in: 1 week

publish:
  stage: publish
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - corepack enable
    - echo "registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - if [[ "$CI_COMMIT_TAG" == *-* ]]; then NPM_TAG=prerelease; else NPM_TAG=latest; fi
    - npm publish "kolt-keyboard-${CI_COMMIT_SHA}.tgz" --ignore-scripts --tag "$NPM_TAG"

release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: release
  needs:
    - job: build
      artifacts: true
    - job: publish
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - glab auth login --hostname "$CI_SERVER_HOST" --job-token "$CI_JOB_TOKEN"
    - glab release create "$CI_COMMIT_TAG" --name "Release $CI_COMMIT_TAG" --notes "Published kolt-keyboard package." --assets-link "{\"name\":\"kolt-keyboard package\",\"url\":\"$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/kolt-keyboard-$CI_COMMIT_SHA.tgz\",\"link_type\":\"package\"}"
  artifacts:
    paths:
      - kolt-keyboard-*.tgz
    expire_in: never
