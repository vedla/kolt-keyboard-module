image: node:22

stages:
  - build
  - publish

variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn-cache'

cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .yarn-cache/

build:
  stage: build
  script:
    - corepack enable
    - yarn install --frozen-lockfile
    - yarn build
    - yarn pack --filename "kolt-keyboard-${CI_COMMIT_SHA}.tgz"
  artifacts:
    paths:
      - kolt-keyboard-*.tgz
    expire_in: 1 week

publish:
  stage: publish
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - corepack enable
    - printf "registry=https://%s/api/v4/projects/%s/packages/npm/\n//%s/api/v4/projects/%s/packages/npm/:_authToken=%s\n" "$CI_SERVER_HOST" "$CI_PROJECT_ID" "$CI_SERVER_HOST" "$CI_PROJECT_ID" "$CI_JOB_TOKEN" > .npmrc
    - npm publish "kolt-keyboard-${CI_COMMIT_SHA}.tgz"
